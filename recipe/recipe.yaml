schema_version: 1

context:
  version: "1.7.2"

package:
  name: simple-build-dgcode
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/simple-build-dgcode/simple_build_dgcode-${{ version }}.tar.gz
  #NB: get sha256 from https://pypi.org/project/simple-build-dgcode/#files
  sha256: dfbd7aba9e1164a0a2a7e275481a6b3ca2ac362253c4d8508fdfbe52bff7b364

build:
  number: 1
  noarch: python
  script: python -m pip install --no-deps -vv .
  python:
    entry_points:
      - dgcode_newsimproject = simplebuild_dgcode._cli:newsimproject

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-git-versioning
  run:
    - python >=${{ python_min }}
    - simple-build-system >=1.2.6

tests:
  - python:
      imports:
        - simplebuild_dgcode
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script: run_test.sh
    requirements:
      run:
        - python ${{ python_min }}.*
        - c-compiler
        - cxx-compiler
        - ncrystal
        - zlib
        - pip
        #Unfortunately the geant4 packages are inconsistent/outdated (see
        #https://github.com/conda-forge/geant4-feedstock/issues/65), so we try
        #this workaround for now:
        - geant4 =11.1.3
        - geant4-data-ndl =4.7.0

about:
  homepage: https://mctools.github.io/simplebuild-dgcode
  summary: A set of simplebuild packages implementing a Geant4-based simulation framework
  description: |
    A set of simplebuild packages implementing "dgcode", a Geant4-based
    simulation framework. It is primarily intended for usage for simulation of
    thermal neutron detectors and related projects, and it originated in the
    Detector Group at the European Spallation Source ERIC.
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://mctools.github.io/simplebuild-dgcode
  repository: https://github.com/mctools/simplebuild-dgcode

extra:
  recipe-maintainers:
    - tkittel
